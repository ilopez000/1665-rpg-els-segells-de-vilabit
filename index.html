<title>Els Segells de Vilabit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Món únic i deliberat: una vila de píxels vista de nit des d'una consola. Tema fosc fix. */
:root {
  --night: #171a33;       /* fons de la pàgina */
  --panel: #232848;       /* marcs i panells */
  --panel-2: #2f365e;     /* fons d'elements dins del panell */
  --line: #4b5488;        /* vores */
  --paper: #fff6e3;       /* text principal */
  --muted: #b9bde0;       /* text secundari */
  --gold: #ffcc4d;        /* segells, XP, focus */
  --red: #e1211d;         /* accent del centre */
  --ok: #4fd18b;
  --bad: #ff7466;
  --sel: #6fb7ff;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--paper); font-family: var(--f-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box; overflow: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; max-width: 1200px; margin: 0 auto; }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; color: var(--gold); white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; letter-spacing: .06em; }
.seals { display: flex; gap: 4px; }
.seal { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-display); font-size: 11px; color: var(--muted); }
.seal.on { border: 2px solid #8a5a00; background: radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 55%, #c98a00); color: #4a2d00; font-weight: 700; }
.stat { font-family: var(--f-display); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat b { color: var(--gold); }
.hud .spacer { flex: 1; }
.hbtn { background: var(--panel-2); border: 2px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-family: var(--f-display); font-size: 14px; }
.hbtn:hover { border-color: var(--gold); }
.goal { flex-basis: 100%; font-size: 13.5px; color: var(--muted); }
.goal b { color: var(--paper); }

/* Escena */
#stageWrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#stage { position: relative; aspect-ratio: 5 / 3; width: min(100%, calc((100dvh - 150px) * 5 / 3)); max-width: 100%; }
#cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; border: 3px solid var(--line); border-radius: 6px; background: #000; }

/* Diàleg */
#dialog { position: absolute; left: 2%; right: 2%; bottom: 3%; background: var(--panel); border: 3px solid var(--paper); border-radius: 8px; box-shadow: 0 0 0 3px var(--panel), 0 8px 0 rgba(0,0,0,.35); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
#dialog .por { width: 72px; height: 72px; flex: none; background: var(--panel-2); border: 2px solid var(--line); border-radius: 6px; image-rendering: pixelated; }
#dialog .txt { min-width: 0; flex: 1; }
#dialog .who { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 17px; margin-bottom: 4px; }
#dialog .say { font-size: clamp(14px, 1.9vw, 18px); line-height: 1.45; min-height: 3em; }
#dialog .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#dialog .choices button { background: var(--panel-2); border: 2px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-family: var(--f-display); font-size: 15px; }
#dialog .choices button.hi, #dialog .choices button:hover { border-color: var(--gold); color: var(--gold); }
#dialog .more { position: absolute; right: 12px; bottom: 6px; font-family: var(--f-display); color: var(--gold); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

#toast { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--gold); border-radius: 6px; padding: 6px 14px; font-family: var(--f-display); font-size: 16px; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; }

/* Controls tàctils */
#touch { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end; padding: 10px; pointer-events: none; }
body.touch #touch { display: flex; }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); pointer-events: auto; opacity: .85; }
.dpad button, .abtn { background: rgba(35,40,72,.85); border: 2px solid var(--line); border-radius: 8px; font-family: var(--f-display); font-size: 20px; touch-action: none; }
.dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
.abtn { width: 64px; height: 64px; border-radius: 50%; pointer-events: auto; color: var(--gold); opacity: .9; }

/* Finestres */
#modal { position: fixed; inset: 0; background: rgba(10,12,28,.82); display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.win { width: min(980px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 3px solid var(--paper); border-radius: 10px; box-shadow: 0 0 0 4px var(--panel); padding: 18px 20px 20px; }
.win h2 { font-family: var(--f-display); font-weight: 700; color: var(--gold); margin: 0 0 4px; font-size: clamp(22px, 3vw, 30px); text-wrap: balance; letter-spacing: .02em; }
.win h3 { font-family: var(--f-display); font-weight: 700; margin: 14px 0 6px; font-size: 19px; color: var(--paper); }
.win p { margin: 6px 0; line-height: 1.5; max-width: 70ch; }
.eyebrow { font-family: var(--f-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { background: var(--red); color: #fff; border: 2px solid #ff8b86; border-radius: 6px; padding: 9px 16px; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: var(--panel-2); border-color: var(--line); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { background: var(--panel-2); color: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 9px 10px; font: inherit; min-width: 0; }
.title-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.title-art { width: 100%; image-rendering: pixelated; border: 2px solid var(--line); border-radius: 8px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 58px); line-height: .95; color: var(--gold); text-shadow: 3px 3px 0 var(--red), 6px 6px 0 #000; margin: 4px 0 10px; }
.keys { font-size: 13.5px; color: var(--muted); }
kbd { font-family: var(--f-display); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 0 5px; color: var(--paper); }

/* Proves */
.chal-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.pill { font-family: var(--f-display); font-size: 13px; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: var(--panel-2); border: 2px dashed var(--line); border-radius: 8px; min-height: 56px; margin: 10px 0; }
.chip { background: var(--paper); color: #1d2140; border: 3px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 15px; line-height: 1.3; text-align: left; max-width: 100%; box-shadow: 0 3px 0 #9fa3c7; }
.chip.sel { border-color: var(--sel); transform: translateY(-2px); }
.chip.good { background: #d4f7e2; box-shadow: 0 3px 0 var(--ok); cursor: default; }
.chip.wrong { background: #ffe0dc; box-shadow: 0 3px 0 var(--bad); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.bin { background: var(--panel-2); border: 2px solid var(--line); border-radius: 8px; padding: 8px; min-height: 110px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.bin:hover, .bin.target { border-color: var(--sel); }
.bin .bl { font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--gold); }
.bin .bs { font-size: 12px; color: var(--muted); margin-top: -4px; }
.fb { margin-top: 10px; padding: 10px 12px; border-radius: 6px; background: var(--panel-2); border-left: 6px solid var(--line); line-height: 1.45; }
.fb.ok { border-left-color: var(--ok); }
.fb.ko { border-left-color: var(--bad); }
.fb ul { margin: 6px 0 0; padding-left: 20px; }
.q { font-size: clamp(17px, 2.1vw, 21px); line-height: 1.4; margin: 10px 0; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; font-size: 16px; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--sel); }
.opt.good { border-color: var(--ok); background: #1f4a3a; }
.opt.wrong { border-color: var(--bad); background: #5a2630; }
.opt:disabled { cursor: default; }
.seq { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #1c2040; border: 2px solid var(--line); border-radius: 8px; min-height: 56px; counter-reset: s; }
.seq .chip::before { counter-increment: s; content: counter(s) ". "; font-weight: 700; }
.bar { height: 16px; background: #10132a; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #b06ad9, #ff7ad1); transition: width .5s; }
.hearts { font-family: var(--f-display); font-size: 22px; color: var(--bad); letter-spacing: 4px; }
.boss-grid { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; }
.boss-por { width: 120px; height: 120px; image-rendering: pixelated; background: var(--panel-2); border: 2px solid var(--line); border-radius: 8px; }
.bubble { background: var(--paper); color: #1d2140; border-radius: 10px; padding: 10px 14px; font-size: 18px; line-height: 1.4; position: relative; font-weight: 700; }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { background: var(--panel-2); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; font-size: 14px; line-height: 1.4; }
.card h4 { margin: 0 0 4px; font-family: var(--f-display); font-size: 16px; color: var(--gold); }
.card.locked { color: var(--muted); border-style: dashed; }
.card dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; }
.card dt { font-weight: 700; color: var(--muted); }
.card dd { margin: 0; }
.tbl-wrap { overflow-x: auto; }
table.res { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
table.res th { font-family: var(--f-display); color: var(--gold); font-weight: 700; }
.lvl { font-family: var(--f-display); font-size: 13px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.lvl.a { background: #1f4a3a; color: var(--ok); } .lvl.b { background: #2c3f5c; color: var(--sel); } .lvl.c { background: #4d3b1d; color: var(--gold); } .lvl.d { background: #5a2630; color: var(--bad); } .lvl.n { background: var(--panel-2); color: var(--muted); }
.big { font-family: var(--f-display); font-size: clamp(40px, 7vw, 64px); color: var(--gold); line-height: 1; }
.langs { display: inline-flex; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
.lang { background: var(--panel-2); border: 0; padding: 6px 14px; cursor: pointer; font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.lang + .lang { border-left: 2px solid var(--line); }
.lang.on { background: var(--gold); color: #3a2a00; font-weight: 700; }
.lang-btn { min-width: 44px; font-weight: 700; color: var(--gold); }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 12px 0; }
.stats-row > div { border-left: 4px solid var(--line); padding-left: 12px; min-width: 0; }
.stats-row .big { font-size: clamp(30px, 5vw, 46px); }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (max-width: 640px) {
  .title-grid, .boss-grid { grid-template-columns: 1fr; }
  .boss-por { width: 88px; height: 88px; }
  .brand small { display: none; }
  #dialog .por { width: 52px; height: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    case "biel": return say([{ who: "biel", text: tr("A l'agència unim les dades del web, de la botiga i del CRM. La IA prediu quins clients marxaran.") }, { who: "biel", text: tr("Però si les dades són dolentes, la IA treu conclusions falses amb cara de científiques. Dades bones primer!") }]);
    case "bit": SFX.talk(); return say([{ who: "bit", text: tr(shuffle(["Miau. (El gat et mira com si sabés que la ciberseguretat és una habilitadora.)", "Prrr... (S'estira sobre el sensor de temperatura. Ara marca 38 °C.)", "Miau! (Ha trepitjat el teclat i ha creat un mercat nou.)"])[0]) }]);
  }
}

/* ================= CHALLENGES ================= */
let C = null;
function modalOpen(html) { mode = "modal"; $("win").innerHTML = html; $("modal").hidden = false; $("win").scrollTop = 0; }
function modalClose() { $("modal").hidden = true; $("win").innerHTML = ""; mode = "play"; held.clear(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function openChallenge(k, practice = false) {
  const q = QUESTS[k];
  C = { k, practice, part: 0, stats: { total: 0, firstOk: 0, checks: 0, errors: [], startedAt: Date.now() } };
  renderPart();
}
function head(title, extra = "") {
  const q = QUESTS[C.k];
  return `<div class="chal-head"><div><div class="eyebrow">${tr("Criteri")} ${C.k} · ${esc(q.nom)}${C.practice ? " · " + tr("pràctica") : ""}</div><h2>${esc(title)}</h2></div><div class="row"><span class="pill">${tr("Part {a} de {b}", { a: C.part + 1, b: q.parts.length })}</span>${extra}</div></div>`;
}
function renderPart() {
  const part = QUESTS[C.k].parts[C.part];
  if (part.type === "classify") renderClassify(part);
  else if (part.type === "mcq") renderMcq(part);
  else if (part.type === "order") renderOrder(part);
}
function nextPart() { C.part++; if (C.part >= QUESTS[C.k].parts.length) finishChallenge(); else renderPart(); }

/* classificar */
function renderClassify(part) {
  const st = { assign: {}, sel: null, checked: false, firstDone: false, locked: {} };
  const items = shuffle(part.items);
  C.cl = st;
  modalOpen(`${head(part.titol)}<p>${esc(part.prompt)}</p><div class="pool" id="pool"></div><div class="bins" id="bins"></div><div id="fb"></div><div class="row" style="margin-top:12px"><button class="btn" id="chk" type="button" disabled>${tr("Comprova")}</button><button class="btn ghost" id="cancel" type="button">${tr("Surt")}</button></div>`);
  const draw = () => {
    const chip = it => `<button type="button" class="chip ${st.sel === it.id ? "sel" : ""} ${st.locked[it.id] ? "good" : ""} ${st.wrong && st.wrong.includes(it.id) ? "wrong" : ""}" data-id="${it.id}">${esc(it.text)}</button>`;
    $("pool").innerHTML = items.filter(it => !st.assign[it.id]).map(chip).join("") || `<span class="eyebrow">${tr("Totes col·locades")}</span>`;
    $("bins").innerHTML = part.bins.map(b => `<div class="bin" data-bin="${b.id}" role="button" tabindex="0"><div class="bl">${esc(b.label)}</div>${b.sub ? `<div class="bs">${esc(b.sub)}</div>` : ""}${items.filter(it => st.assign[it.id] === b.id).map(chip).join("")}</div>`).join("");
    $("chk").disabled = items.some(it => !st.assign[it.id]);
    $("win").querySelectorAll(".chip").forEach(el => el.onclick = (e) => {
      e.stopPropagation(); const id = el.dataset.id; const binEl = el.closest(".bin");
      if (st.sel && st.sel !== id && binEl) { st.assign[st.sel] = binEl.dataset.bin; st.sel = null; SFX.talk(); draw(); return; }
      if (st.locked[id]) return; st.sel = st.sel === id ? null : id; SFX.talk(); draw(); });
    $("win").querySelectorAll(".bin").forEach(el => { const act = () => { if (!st.sel) return; st.assign[st.sel] = el.dataset.bin; st.sel = null; SFX.talk(); draw(); }; el.onclick = act; el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }; });
  };
  $("pool").onclick = () => { if (st.sel && st.assign[st.sel]) { delete st.assign[st.sel]; st.sel = null; draw(); } };
  $("cancel").onclick = () => { modalClose(); C = null; };
  $("chk").onclick = () => {
    const wrong = items.filter(it => st.assign[it.id] !== it.bin);
    C.stats.checks++;
    if (!st.firstDone) {
      st.firstDone = true; C.stats.total += items.length; C.stats.firstOk += items.length - wrong.length;
      wrong.forEach(it => C.stats.errors.push({ q: it.text, given: labelOf(part, st.assign[it.id]), correct: labelOf(part, it.bin), why: it.why }));
    }
    items.forEach(it => { if (st.assign[it.id] === it.bin) st.locked[it.id] = true; });
    st.wrong = wrong.map(it => it.id);
    if (!wrong.length) {
      SFX.ok(); draw();
      $("fb").innerHTML = `<div class="fb ok"><b>${tr("Perfecte!")}</b> ${tr("Totes al seu lloc.")}</div>`;
      $("chk").textContent = tr("Continua"); $("chk").disabled = false; $("chk").onclick = nextPart; $("chk").focus();
    } else {
      SFX.bad(); feeling = 8;
      // les incorrectes tornen a la safata
      wrong.forEach(it => delete st.assign[it.id]);
      draw();
      $("fb").innerHTML = `<div class="fb ko"><b>${tr(wrong.length === 1 ? "{n} no és al seu lloc." : "{n} no són al seu lloc.", { n: wrong.length })}</b> ${tr("Han tornat a la safata. Pistes:")}<ul>${wrong.map(it => `<li>${esc(it.why)}</li>`).join("")}</ul></div>`;
    }
  };
  draw();
}
function labelOf(part, binId) { const b = part.bins.find(b => b.id === binId); return b ? b.label : "—"; }

/* test */
function renderMcq(part) {
  let qi = 0;
  const qs = part.questions.map(q => { const order = shuffle(q.opts.map((o, i) => i)); return { ...q, order }; });
  const show = () => {
    const q = qs[qi];
    modalOpen(`${head(part.titol, `<span class="pill">${tr("Pregunta")} ${qi + 1}/${qs.length}</span>`)}<p class="q">${esc(q.q)}</p><div class="opts">${q.order.map((oi, k) => `<button type="button" class="opt" data-oi="${oi}">${String.fromCharCode(65 + k)}. ${esc(q.opts[oi])}</button>`).join("")}</div><div id="fb"></div><div class="row" style="margin-top:12px"><button class="btn" id="nxt" type="button" hidden>${tr("Continua")}</button><button class="btn ghost" id="cancel" type="button">${tr("Surt")}</button></div>`);
    $("cancel").onclick = () => { modalClose(); C = null; };
    $("win").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const oi = +b.dataset.oi, ok = oi === q.a;
      C.stats.total++; C.stats.checks++; if (ok) C.stats.firstOk++; else C.stats.errors.push({ q: q.q, given: q.opts[oi], correct: q.opts[q.a], why: q.why });
      $("win").querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.oi === q.a) x.classList.add("good"); });
      if (!ok) { b.classList.add("wrong"); SFX.bad(); feeling = 8; } else SFX.ok();
      $("fb").innerHTML = `<div class="fb ${ok ? "ok" : "ko"}"><b>${ok ? tr("Correcte!") : tr("No és aquesta.")}</b> ${esc(q.why)}</div>`;
      const nx = $("nxt"); nx.hidden = false; nx.focus();
      nx.onclick = () => { qi++; if (qi >= qs.length) nextPart(); else show(); };
    });
  };
  show();
}

/* ordenar */
function renderOrder(part) {
  const st = { seq: [], locked: 0, firstDone: false };
  const pool = shuffle(part.items.map((t, i) => ({ id: i, text: t })));
  modalOpen(`${head(part.titol)}<p>${esc(part.prompt)}</p><h3>${tr("El teu informe")}</h3><div class="seq" id="seq"></div><h3>${tr("Blocs desordenats")}</h3><div class="pool" id="pool"></div><div id="fb"></div><div class="row" style="margin-top:12px"><button class="btn" id="chk" type="button" disabled>${tr("Comprova")}</button><button class="btn ghost" id="cancel" type="button">${tr("Surt")}</button></div>`);
  $("cancel").onclick = () => { modalClose(); C = null; };
  const draw = () => {
    $("seq").innerHTML = st.seq.map((it, i) => `<button type="button" class="chip ${i < st.locked ? "good" : ""}" data-i="${i}">${esc(it.text)}</button>`).join("") || `<span class="eyebrow">${tr("Toca els blocs de sota en ordre")}</span>`;
    $("pool").innerHTML = pool.filter(it => !st.seq.includes(it)).map(it => `<button type="button" class="chip" data-id="${it.id}">${esc(it.text)}</button>`).join("") || `<span class="eyebrow">${tr("Tots col·locats")}</span>`;
    $("chk").disabled = st.seq.length !== part.items.length;
    $("seq").querySelectorAll(".chip").forEach(el => el.onclick = () => { const i = +el.dataset.i; if (i < st.locked) return; st.seq.splice(i, 1); SFX.talk(); draw(); });
    $("pool").querySelectorAll(".chip").forEach(el => el.onclick = () => { st.seq.push(pool.find(p => p.id === +el.dataset.id)); SFX.talk(); draw(); });
  };
  $("chk").onclick = () => {
    C.stats.checks++;
    const res = st.seq.map((it, i) => it.id === i);
    if (!st.firstDone) {
      st.firstDone = true; C.stats.total += part.items.length; C.stats.firstOk += res.filter(Boolean).length;
      st.seq.forEach((it, i) => { if (it.id !== i) C.stats.errors.push({ q: tr("Bloc {n} de l'informe", { n: i + 1 }), given: it.text, correct: part.items[i], why: tr("Ordre de l'informe:") + " " + part.items.join(" · ") + "." }); });
    }
    const firstBad = res.indexOf(false);
    if (firstBad === -1) {
      st.locked = st.seq.length; draw(); SFX.ok();
      $("fb").innerHTML = `<div class="fb ok"><b>${tr("Informe en ordre!")}</b></div>`; $("chk").textContent = tr("Continua"); $("chk").disabled = false; $("chk").onclick = nextPart; $("chk").focus(); return;
    }
    SFX.bad(); feeling = 8;
    st.seq = st.seq.slice(0, firstBad); st.locked = firstBad; draw();
    $("fb").innerHTML = `<div class="fb ko"><b>${tr("El bloc {n} no va aquí.", { n: firstBad + 1 })}</b> ${tr("Els blocs ben posats fins al primer error es queden; la resta han tornat a la safata. Pensa: què ha de trobar primer qui obre l'informe?")}</div>`;
  };
  draw();
}

function finishChallenge() {
  const k = C.k, q = QUESTS[k], st = C.stats;
  const pct = st.total ? Math.round(100 * st.firstOk / st.total) : 0;
  if (C.practice) {
    modalOpen(`<div class="eyebrow">${tr("Pràctica · no puntua")}</div><h2>${tr("Prova repassada")}</h2><p>${tr("Encerts a la primera:")} <b>${st.firstOk}/${st.total}</b> (${pct}%). ${tr("La puntuació oficial és la de la primera vegada.")}</p><div class="row"><button class="btn" id="ok" type="button">${tr("Torna a Vilabit")}</button></div>`);
    $("ok").onclick = () => { modalClose(); }; C = null; return;
  }
  st.ms = Date.now() - st.startedAt; delete st.startedAt;
  S.stats[k] = st; S.seals[k] = true; addXp(60 + pct * 1.4); save(); hud();
  SFX.seal(); confetti();
  const npc = npcById[q.npc];
  modalOpen(`<div class="eyebrow">${tr("Segell aconseguit")}</div><h2>${tr("Segell")} ${k} · ${esc(q.nom)}</h2><div class="row" style="gap:18px;align-items:center"><div class="seal on" style="width:72px;height:72px;font-size:22px">${k}</div><div><div class="big">${pct}%</div><div class="eyebrow">${tr("encerts a la primera")} (${st.firstOk}/${st.total})</div></div></div><p>${esc(CA[k])}</p><p><b>${tr("Idea clau:")}</b> ${esc(q.idea)}</p><p>${Object.keys(S.seals).length === 7 ? "<b>" + tr("Ja tens els set segells!") + "</b> " + tr("Ves a l'Ajuntament i parla amb l'Alcaldessa.") : tr("Et falten {n} segells.", { n: 7 - Object.keys(S.seals).length })}</p><div class="row"><button class="btn" id="ok" type="button">${tr("Torna a Vilabit")}</button></div>`);
  $("ok").onclick = () => { modalClose(); }; $("ok").focus();
  C = null;
}

/* ================= BOSS ================= */
let B = null;
function openBoss() {

}
function renderBoss() {
  const q = B.qs[B.i];
  modalOpen(`<div class="chal-head"><div><div class="eyebrow">${tr("Assemblea de Vilabit · debat final")}${S.boss.attempts > 1 ? " · " + tr("intent") + " " + S.boss.attempts : ""}</div><h2>${tr("Debat contra en Fum")}</h2></div><span class="pill">${tr("Afirmació")} ${B.i + 1}/${B.qs.length}</span></div>

  <div class="row" style="margin-top:12px"><button class="btn" id="nxt" type="button" hidden>${tr("Continua")}</button><button class="btn ghost" id="cancel" type="button">${tr("Abandona el debat")}</button></div>`);

    if (ok) { B.ok++; B.hype = Math.max(0, 100 - Math.round(100 * B.ok / B.qs.length)); SFX.ok(); }
    else { B.hearts--; b.classList.add("wrong"); SFX.bad(); feeling = 14; }
    if (!ok) B.errs.push({ q: npcName(npcById.fum) + ": «" + q.claim + "»", given: q.opts[oi], correct: q.opts[q.a], why: q.why });

    const nx = $("nxt"); nx.hidden = false; nx.focus();

}
function scoreBoss() { if (B && B.first && !S.boss.scored) { S.boss.scored = true; S.boss.firstOk = B.ok; S.boss.errors = B.errs; } }
function bossLost() {
  scoreBoss(); save();
  modalOpen(`<div class="eyebrow">${tr("L'assemblea dubta")}</div><h2>${tr("En Fum ha guanyat aquest debat")}</h2><p>${tr("Has perdut tota la credibilitat. Repassa els cartells i el Còdex i torna-ho a provar: les preguntes canvien d'ordre.")}</p><p>${tr("La puntuació del debat és la del primer intent.")}</p><div class="row"><button class="btn" id="again" type="button">${tr("Torna-ho a provar")}</button><button class="btn ghost" id="later" type="button">${tr("Ara no")}</button></div>`);

}
function bossWon() {
  scoreBoss(); S.boss.won = true; S.boss.hearts = B.hearts; S.finished = true; S.finishedAt = Date.now();

  const f = npcById.fum; f.fx = -3; f.fy = -3; f.rx = -3; f.ry = -3; // marxa del poble

/* ================= RESULTS & PDF ================= */
function results() {
  const rows = QUEST_ORDER.map(k => {
    const st = S.stats[k]; const pct = st && st.total ? Math.round(100 * st.firstOk / st.total) : null;
    return { k, ca: CA[k], prova: QUESTS[k].nom, st, pct };
  });
  const b = S.boss; const bossPct = b && b.scored ? Math.round(100 * b.firstOk / b.total) : null;
  const vals = rows.map(r => r.pct ?? 0).concat([bossPct ?? 0]);
  const global = Math.round(vals.reduce((a, c) => a + c, 0) / vals.length);
  return { rows, bossPct, global };
}
function level(p) {
  if (p == null) return { t: tr("Pendent"), c: "n" };
  if (p >= 90) return { t: tr("Excel·lent"), c: "a" };
  if (p >= 70) return { t: tr("Assolit"), c: "b" };
  if (p >= 50) return { t: tr("En procés"), c: "c" };
  return { t: tr("Cal repassar"), c: "d" };
}
function rank(g) { return tr(g >= 90 ? "Mestre/a de la transformació digital" : g >= 75 ? "Consultor/a digital" : g >= 60 ? "Tècnic/a en digitalització" : "Aprenent digital"); }
function fmtMin(ms) { const m = Math.max(1, Math.round(ms / 60000)); return m + " min"; }
function resultsTable() {
  const R = results();
  return `<div class="tbl-wrap"><table class="res"><thead><tr><th>${tr("Criteri")}</th><th>${tr("Prova")}</th><th>${tr("Encerts a la primera")}</th><th>%</th><th>${tr("Nivell")}</th></tr></thead><tbody>${R.rows.map(r => { const l = level(r.pct); return `<tr><td><b>${r.k}</b> ${esc(r.ca)}</td><td>${esc(r.prova)}</td><td>${r.st ? r.st.firstOk + "/" + r.st.total : "—"}</td><td>${r.pct ?? "—"}</td><td><span class="lvl ${l.c}">${l.t}</span></td></tr>`; }).join("")}<tr><td><b>${tr("Debat")}</b> ${tr("Integra tots els criteris")}</td><td>${tr("Debat contra en Fum")}</td><td>${S.boss?.scored ? S.boss.firstOk + "/" + S.boss.total : "—"}</td><td>${R.bossPct ?? "—"}</td><td><span class="lvl ${level(R.bossPct).c}">${level(R.bossPct).t}</span></td></tr></tbody></table></div>`;
}
function endScreen() {
  const R = results();
  modalOpen(`<div class="eyebrow">${tr("Vilabit és a salvo del fum")}</div><h2>${tr("Has guanyat el debat!")}</h2><p>${tr("En Fum ha recollit els fullets i ha marxat del poble. L'Alcaldessa t'ha nomenat")} <b>${esc(rank(R.global))}</b>.</p>
  <div class="stats-row"><div><div class="big">${R.global}</div><div class="eyebrow">${tr("puntuació sobre 100")}</div></div><div><div class="big">${Object.keys(S.seals).length}/7</div><div class="eyebrow">${tr("segells")}</div></div><div><div class="big">${S.fitxes.length}/11</div><div class="eyebrow">${tr("fitxes THD")}</div></div><div><div class="big">${S.xp}</div><div class="eyebrow">XP</div></div></div>
  ${resultsTable()}<p>${tr("Descarrega l'informe en PDF i lliura'l al teu professor o professora.")}</p><div id="pdfMsg"></div>
  <div class="row"><button class="btn" id="pdf" type="button">${tr("Descarrega l'informe PDF")}</button><button class="btn ghost" id="cont" type="button">${tr("Continua explorant")}</button></div>`);
  $("pdf").onclick = makePdf; $("cont").onclick = () => modalClose(); $("pdf").focus();
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(7, "0").slice(-7); }
function pdfTxt(s) { return String(s).replace(/→/g, "->").replace(/[−–—]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "...").replace(/♥/g, "*").replace(/[^\x00-\xFF]/g, ""); }
let dlCap = null;
function initDownloads() { try { if (window.claude && typeof window.claude.use === "function") dlCap = window.claude.use("downloads").catch(() => null); } catch (e) { dlCap = null; } }
async function makePdf() {
  const msg = $("pdfMsg");
  if (!window.jspdf || !window.jspdf.jsPDF) { if (msg) msg.innerHTML = `<div class="fb ko">${tr("No s'ha pogut carregar el generador de PDF. Comprova la connexió a Internet i torna-ho a provar.")}</div>`; return; }
  const doc = buildPdf();
  const fname = "Vilabit_RA2_" + (S.name || tr("alumne")).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") + ".pdf";
  const cap = dlCap ? await dlCap : null;
  if (cap) {
    try { await cap.save({ filename: fname, data: doc.output("blob") }); if (msg) msg.innerHTML = `<div class="fb ok">${tr("Informe desat.")}</div>`; }
    catch (e) { if (msg) msg.innerHTML = `<div class="fb ko">${e && e.code === "declined" ? tr("Has cancel·lat la descàrrega.") : tr("No s'ha pogut desar l'informe en aquesta vista.")}</div>`; }
    return;
  }
  doc.save(fname);
  if (msg) msg.innerHTML = `<div class="fb ok">${tr("Informe descarregat:")} <b>${esc(fname)}</b>.</div>`;
}
function buildPdf() {
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"); c.hidden = false; c.width = innerWidth; c.height = innerHeight; const g = c.getContext("2d");
  const parts = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4, c: ["#ffcc4d", "#e1211d", "#4fd18b", "#6fb7ff", "#ff7ad1"][Math.floor(Math.random() * 5)], s: 4 + Math.random() * 5 }));
  let n = 0;
  const step = () => { g.clearRect(0, 0, c.width, c.height); parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; g.fillStyle = p.c; g.fillRect(p.x, p.y, p.s, p.s); }); if (++n < 110) requestAnimationFrame(step); else { g.clearRect(0, 0, c.width, c.height); c.hidden = true; } };
  step();
}

const KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if ((mode === "dialog" || mode === "play") && tag === "BUTTON" && (e.key === " " || e.key === "Enter")) { e.preventDefault(); e.target.blur(); }
  if (mode === "dialog") {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); moveChoice(-1); }
    else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); moveChoice(1); }
    else if (/^[1-9]$/.test(e.key) && D && D.full && D.pages[D.i].choices && D.pages[D.i].choices[+e.key - 1]) choose(+e.key - 1);
    return;
  }
  if (mode === "modal") { if (e.key === "Escape" && !C && !B && $("x")) modalClose(); return; }
  if (mode !== "play") return;
  if (KEYMAP[e.key]) { e.preventDefault(); held.delete(KEYMAP[e.key]); held.add(KEYMAP[e.key]); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); interact(); }
  else if (e.key === "c" || e.key === "C") openCodex();
  else if (e.key === "q" || e.key === "Q") openQuests();
});
addEventListener("keyup", e => { if (KEYMAP[e.key]) held.delete(KEYMAP[e.key]); });
addEventListener("blur", () => held.clear());
